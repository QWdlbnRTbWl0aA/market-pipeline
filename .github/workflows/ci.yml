name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared image dependency
        run: python3 -m pip install -r requirements.txt
      - name: Functional tests (no paid/source calls)
        run: python3 tools/test.py
      - name: Publication audit
        run: python3 tools/publish_check.py
